name: Release and publish package

on:
  push:
    branches:
      - main

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  REGISTRY: https://registry.npmjs.org

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          node -e 'const { name, version } = require("./package.json"); console.log(`name=${name}\nversion=${version}`)' >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: published
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          TAG="v${PACKAGE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; keeping its release notes."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              --jq .body |
              node -e '
                const fs = require("node:fs");
                const notes = fs.readFileSync(0, "utf8")
                  .replace(/ by @[A-Za-z0-9-]+ in (https:\/\/github\.com\/[^\s]+\/pull\/(\d+))/g, " ([#$2]($1))")
                  .replace(/\n## New Contributors\n[\s\S]*?(?=\n## |\n\*\*Full Changelog\*\*|$)/g, "\n");
                process.stdout.write(notes);
              ' > release-notes.md
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "${{ steps.package.outputs.name }} $TAG" \
              --notes-file release-notes.md
          fi
